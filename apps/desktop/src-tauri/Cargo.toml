[package]
name = "relaykit-desktop"
version = "0.1.0"
description = "RelayKit desktop"
authors = ["RelayKit"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5.0", features = [] }

[dependencies]
tauri = { version = "1.6.0", features = ["shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
