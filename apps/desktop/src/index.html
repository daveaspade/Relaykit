<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RelayKit</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; margin: 24px; color: #111; }
      .card { border: 1px solid #ddd; border-radius: 10px; padding: 16px; max-width: 680px; }
      code { background: #f5f5f7; padding: 2px 6px; border-radius: 6px; }
      button { padding: 8px 12px; border-radius: 8px; border: 1px solid #222; background: #111; color: #fff; cursor: pointer; }
      button.secondary { background: #fff; color: #111; }
      .row { display: flex; gap: 12px; flex-wrap: wrap; }
    </style>
  </head>
  <body>
    <h1>RelayKit</h1>
    <div class="card">
      <p><strong>Base URL:</strong> <code>http://127.0.0.1:11435/v1</code></p>
      <p><strong>Docker:</strong> <code>http://host.docker.internal:11435/v1</code></p>
      <div class="row">
        <button id="open-ui">Open Web UI</button>
        <button id="open-health" class="secondary">Check Health</button>
      </div>
      <pre id="output"></pre>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
