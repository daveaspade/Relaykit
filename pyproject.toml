[project]
name = "relaykit"
version = "0.1.0"
description = "Local OpenAI-compatible gateway that routes to OAuth CLI providers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.27.0",
  "pydantic>=2.6.0",
]

[project.scripts]
relaykit = "relaykit.server:main"

[tool.setuptools]
package-dir = {"" = "core"}
packages = ["relaykit", "relaykit.providers"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
